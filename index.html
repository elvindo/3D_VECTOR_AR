<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Bilangan AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #fff;
      font-family: sans-serif;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
    .info-box {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      display: none;
      max-width: 90vw;
      z-index: 10;
    }
    button[slot^="hotspot"] {
      background: #007bff;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <model-viewer src="number_systems_textured_final.glb"
                ar ar-modes="scene-viewer webxr quick-look"
                camera-controls
                auto-rotate
                exposure="1"
                shadow-intensity="1"
                alt="Diagram Sistem Bilangan">

    <!-- Hotspot interaktif -->
    <button slot="hotspot-1" data-position="0.3 0.4 0" onclick="showInfo('Natural')">N</button>
    <button slot="hotspot-2" data-position="0.1 0.1 0" onclick="showInfo('Integer')">Z</button>
    <button slot="hotspot-3" data-position="-0.2 0.1 0" onclick="showInfo('Rational')">Q</button>
    <button slot="hotspot-4" data-position="-0.35 -0.1 0" onclick="showInfo('Real')">R</button>
    <button slot="hotspot-5" data-position="0 -0.4 0" onclick="showInfo('Complex')">C</button>

  </model-viewer>

  <!-- Box informasi -->
  <div id="infoBox" class="info-box"></div>

  <script>
    function showInfo(label) {
      const infoBox = document.getElementById('infoBox');
      let content = '';

      switch (label) {
        case 'Natural':
          content = 'Bilangan asli yang dimulai dari 1, 2, 3...';
          break;
        case 'Integer':
          content = 'Bilangan bulat mencakup negatif, nol, dan positif.';
          break;
        case 'Rational':
          content = 'Bilangan yang bisa ditulis sebagai a/b.';
          break;
        case 'Real':
          content = 'Semua bilangan di garis bilangan.';
          break;
        case 'Complex':
          content = 'Bilangan yang memiliki bagian imajiner, seperti a + bi.';
          break;
        default:
          content = 'Informasi belum tersedia.';
      }

      infoBox.innerHTML = `<strong>${label}</strong><br/>${content}`;
      infoBox.style.display = 'block';

      setTimeout(() => {
        infoBox.style.display = 'none';
      }, 5000);
    }
  </script>
</body>
</html>
